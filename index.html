<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>धर्मगंज - नालंदा डिजिटल आरोग्य पीठ</title>
  <style>
    :root {
      --primary: #8b2500;
      --bg: #fbf9f4;
      --card-bg: #ffffff;
      --text: #2c2523;
      --muted: #6e6259;
      --accent: #2e7d32;
      --warn: #c62828;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; }
    .container { max-width: 750px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 25px; padding-top: 10px; }
    header h1 { font-size: 2rem; color: var(--primary); letter-spacing: 0.5px; }
    header p { color: var(--muted); font-size: 0.95rem; margin-top: 5px; }
    
    .search-box { position: relative; margin-bottom: 25px; }
    .search-input { width: 100%; padding: 14px 18px; font-size: 1.05rem; border: 2px solid #dfd7cc; border-radius: 12px; outline: none; background: #fff; transition: 0.2s; }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 4px 12px rgba(139, 37, 0, 0.1); }
    
    .result-card { background: var(--card-bg); border-radius: 14px; padding: 22px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 1px solid #eee7de; display: none; }
    .badge { display: inline-block; background: #f4ece1; color: var(--primary); font-size: 0.8rem; font-weight: bold; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; }
    .disease-title { font-size: 1.4rem; color: var(--primary); margin-bottom: 8px; }
    .root-cause { font-size: 0.95rem; color: var(--muted); margin-bottom: 18px; border-left: 3px solid var(--primary); padding-left: 10px; }
    
    .section-title { font-size: 1rem; font-weight: 700; margin: 14px 0 6px 0; display: flex; align-items: center; gap: 6px; }
    .step-box { background: #faf8f5; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid #ede5d8; }
    .step-box strong { color: var(--text); display: block; margin-bottom: 3px; }
    
    .pathya { border-left: 4px solid var(--accent); }
    .apatha { border-left: 4px solid var(--warn); }
    
    .empty-state { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>धर्मगंज</h1>
    <p>नालंदा परंपरा पर आधारित प्रामाणिक स्वास्थ्य सूत्र</p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="रोग का नाम खोजें (उदा. एसिडिटी, सिरदर्द, शुगर, बीपी...)" onkeyup="searchDisease()">
  </div>

  <div id="resultsArea"></div>
  <div id="emptyState" class="empty-state">सटीक शास्त्रीय निदान देखने के लिए ऊपर किसी रोग का नाम लिखें।</div>
</div>
